name: atlas-ai-api

services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: atlas_ai_db
      POSTGRES_USER: atlas_ai_user
      POSTGRES_PASSWORD: atlas_ai_password

    ports:
      - '5433:5432'

    volumes:
      - atlas_ai_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas_ai_user -d atlas_ai_db']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  atlas_ai_postgres_data:
