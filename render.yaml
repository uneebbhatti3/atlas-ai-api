# Render Blueprint — production + staging, both deploying from GHCR images
# built by .github/workflows/docker-publish.yml.
#
# Setup required before this Blueprint will work (see docs/CI_CD_SETUP.md):
#   1. Add a registry credential named "ghcr-credentials" in Render
#      (Workspace Settings → Credentials) using a GitHub PAT with
#      read:packages scope — GHCR images are private by default.
#   2. After first sync, copy each service's Deploy Hook URL into
#      GitHub Actions secrets: RENDER_DEPLOY_HOOK_PRODUCTION,
#      RENDER_DEPLOY_HOOK_STAGING.
#   3. Set the "sync: false" env vars below manually in the Render
#      dashboard for each service — never commit real secrets here.

services:
  - type: web
    name: atlas-ai-api-production
    runtime: image
    image:
      url: ghcr.io/uneebbhatti3/atlas-ai-api:latest
      creds:
        fromRegistryCreds:
          name: ghcr-credentials
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '8000'
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-ai-db-production
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: WEB_APP_ORIGIN
        sync: false

  - type: web
    name: atlas-ai-api-staging
    runtime: image
    image:
      url: ghcr.io/uneebbhatti3/atlas-ai-api:integration
      creds:
        fromRegistryCreds:
          name: ghcr-credentials
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: '8000'
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-ai-db-staging
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URl
        sync: false

databases:
  - name: atlas-ai-db-production
    plan: starter
    databaseName: atlas_ai_production
    user: atlas

  - name: atlas-ai-db-staging
    plan: starter
    databaseName: atlas_ai_staging
    user: atlas
